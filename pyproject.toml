[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "inmydata MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "inmydata>=0.0.20",
    "mcp>=1.15.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.1.1",
    "fastmcp==2.12.4",
    "uvicorn",
    "duckdb",
    "httpx"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
