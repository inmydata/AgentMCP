version: 0.2

env:
  variables:
    AWS_REGION: eu-west-1
    ECR_REGISTRY: 921167706163.dkr.ecr.eu-west-1.amazonaws.com
    IMAGE_NAME: agentmcp
    IMAGE_TAG: Development1
    # python:3.11-slim served through the ECR pull-through cache (upstream:
    # Docker Hub). This avoids Docker Hub's unauthenticated pull rate limit.
    # Requires a one-time setup (see notes below):
    #   1. An ECR pull-through cache rule with prefix "docker-hub" pointing at
    #      registry-1.docker.io, configured with Docker Hub credentials stored
    #      in Secrets Manager (secret name must start with ecr-pullthroughcache/).
    #   2. IAM perms on the CodeBuild role: ecr:BatchImportUpstreamImage,
    #      ecr:CreateRepository, ecr:TagResource (plus the usual pull perms).
    PYTHON_BASE_IMAGE: 921167706163.dkr.ecr.eu-west-1.amazonaws.com/docker-hub/library/python:3.11-slim

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
      - echo Running test suite before build...
      # Run pytest in a throwaway container so the gate does not depend on the
      # CodeBuild host having Python/uv. A non-zero exit fails the phase and
      # blocks the image build/push below.
      - docker run --rm -v "$CODEBUILD_SRC_DIR":/app -w /app $PYTHON_BASE_IMAGE sh -c "pip install uv && uv sync --extra test && uv run pytest"
      - docker buildx create --use --name localbuilder
  build:
    commands:
      - echo Building Docker image using buildx local builder...
      - docker buildx build --load --build-arg BASE_IMAGE=$PYTHON_BASE_IMAGE -t $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
      - echo Docker image push completed.
artifacts:
  files: []
